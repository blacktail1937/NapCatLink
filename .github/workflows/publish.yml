# 自动发布工作流 — 当推送 v* 标签时自动发布 crate 到 crates.io
#
# 触发条件：推送以 "v" 开头的 tag（如 v0.1.0-alpha.2）
# 流程：检出代码 → 安装 Rust 工具链 → 检查 → 测试 → 发布
#
# 前置配置：
#   在 GitHub 仓库 Settings → Secrets and variables → Actions 中添加：
#   - CARGO_REGISTRY_TOKEN：crates.io 的 API Token
#     获取方式：https://crates.io/settings/tokens → 创建新 Token（需勾选 publish-update 权限）

name: Publish to crates.io

on:
  push:
    tags:
      # 匹配所有以 v 开头的标签，如 v0.1.0、v1.0.0-alpha.1
      - "v*"

# 同一 tag 只允许一个发布流程运行，避免重复发布
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Rust stable 工具链
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 3. 缓存 Cargo 依赖，加速后续构建
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # 4. 验证 tag 版本与 Cargo.toml 版本一致
      - name: Verify version matches tag
        run: |
          # 从 Cargo.toml 提取版本号
          CARGO_VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          # 从 git tag 提取版本号（去掉 v 前缀）
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Git tag version:    $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Cargo.toml ($CARGO_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      # 5. 代码检查（clippy lint）
      - name: Run clippy
        run: cargo clippy -- -D warnings

      # 6. 运行测试
      - name: Run tests
        run: cargo test

      # 7. 试运行打包（验证能否成功打包，不实际上传）
      - name: Dry-run publish
        run: cargo publish --dry-run

      # 8. 发布到 crates.io
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
